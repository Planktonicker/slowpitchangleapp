# XcodeGen project definition.
#
# The .xcodeproj is generated, never committed:
#
#     cd app && xcodegen generate && open SwingLab.xcodeproj
#
# Re-run `xcodegen generate` whenever this file changes or files are added.
# Plain edits to existing Swift files need nothing but a rebuild.

name: SwingLab

options:
  bundleIdPrefix: com.swinglab
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    # Swift 5 language mode: strict concurrency checking is not something to
    # fight while the measurement core is still being validated.
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"     # iPhone only
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  SwingLab:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swinglab.SwingLab
        PRODUCT_NAME: SwingLab
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        # Release builds get optimised: the fallback detector walks every
        # pixel of every frame, and -Onone makes that unusably slow.
        SWIFT_OPTIMIZATION_LEVEL[config=Release]: "-O"
    info:
      path: SwingLab-Info.plist
      properties:
        CFBundleDisplayName: SwingLab
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: ""
        NSCameraUsageDescription: >-
          SwingLab films your swings at 240fps to measure launch angle and exit
          velocity. Video never leaves this device.
        NSMicrophoneUsageDescription: >-
          SwingLab listens for the crack of bat on ball so it can capture the
          swing without you touching the phone.
        NSPhotoLibraryAddUsageDescription: >-
          Save a swing clip to your photo library to share it.
        # Filming is landscape; browsing results is comfortable in portrait.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Lets clips and CSVs be pulled off with Finder or the Files app,
        # straight into spike/clips/ — no AirDrop in the loop.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIRequiredDeviceCapabilities:
          - arm64

  SwingLabTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          - "Fixtures/**"
      - path: Tests/Fixtures
        buildPhase: resources
    dependencies:
      - target: SwingLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swinglab.SwingLabTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  SwingLab:
    build:
      targets:
        SwingLab: all
        SwingLabTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - SwingLabTests
    profile:
      config: Release
    archive:
      config: Release
