# XcodeGen project definition.
#
# The .xcodeproj is generated, never committed:
#
#     cd app && xcodegen generate && open SwingLab.xcodeproj
#
# Re-run `xcodegen generate` whenever this file changes or files are added.
# Plain edits to existing Swift files need nothing but a rebuild.

name: SwingLab

options:
  bundleIdPrefix: com.swinglab
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    # Swift 5 language mode: strict concurrency checking is not something to
    # fight while the measurement core is still being validated.
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"     # iPhone only
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  SwingLab:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # Asset catalogue: the batter guide artwork. Shipped as an alpha-only
      # PNG with a template rendering intent, so SwiftUI tints it rather than
      # drawing the artist's black.
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swinglab.SwingLab
        PRODUCT_NAME: SwingLab
        CODE_SIGN_STYLE: Automatic
        # Named explicitly rather than left to Xcode's default. Once a catalogue
        # exists, actool insists on finding the icon set this names — that is
        # the "None of the input catalogs contained a matching ... app icon set"
        # build error, and it is a missing icon, not a broken catalogue.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        # Optimised in BOTH configurations, Debug included.
        #
        # The detector walks every pixel of every frame — about two million per
        # frame at 1080p — and at -Onone each of those is an unspecialised call
        # with retain/release traffic around it. The difference is not a few
        # percent: a two-second 240fps clip goes from minutes to seconds. Since
        # this app is tested by running it in a field rather than by stepping
        # through it in lldb, losing some debuggability is the right side of
        # that trade. Turn it back to -Onone temporarily if you ever do need to
        # step through the pipeline.
        SWIFT_OPTIMIZATION_LEVEL: "-O"
    info:
      path: SwingLab-Info.plist
      properties:
        CFBundleDisplayName: SwingLab
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Declared up front so TestFlight stops asking on every single upload.
        # It is also simply true: the app makes no network requests at all —
        # every frame, clip and measurement stays on the device — so it uses no
        # encryption beyond what the OS does for its own storage, which is
        # exempt. Revisit this the day any upload or sync feature is added.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: ""
        NSCameraUsageDescription: >-
          SwingLab films your swings at 240fps to measure launch angle and exit
          velocity. Video never leaves this device.
        NSMicrophoneUsageDescription: >-
          SwingLab listens for the crack of bat on ball so it can capture the
          swing without you touching the phone.
        NSPhotoLibraryAddUsageDescription: >-
          Save a swing clip to your photo library to share it.
        NSPhotoLibraryUsageDescription: >-
          Read a clip you already filmed so SwingLab can measure it. Reading the
          library directly is the only way to get the ORIGINAL slow-motion
          recording — every other route hands over a 30fps render of it, and a
          240fps clip measured as 30fps is wrong by a factor of eight.
        # "All interface orientations must be supported unless the app requires
        # full screen." It does: this is a camera instrument on a tripod, and
        # there is no sensible Split View or Slide Over presentation of a
        # viewfinder. Declaring it is also what allows the orientation list
        # below to omit upside-down.
        UIRequiresFullScreen: true
        # Filming is landscape; browsing results is comfortable in portrait.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Lets clips and CSVs be pulled off with Finder or the Files app,
        # straight into spike/clips/ — no AirDrop in the loop.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIRequiredDeviceCapabilities:
          - arm64

  SwingLabTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          - "Fixtures/**"
      - path: Tests/Fixtures
        buildPhase: resources
    dependencies:
      - target: SwingLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swinglab.SwingLabTests
        GENERATE_INFOPLIST_FILE: YES

  # SwingLab Pro — the multi-phone 3D capture variant (docs/SWINGLAB_PRO.md).
  # A SECOND app over the SAME tree, not a fork: everything in Sources/ except
  # the @main file compiles into both apps, so the shipping SwingLab target
  # above stays untouched by construction while Pro grows in SourcesPro/.
  SwingLabPro:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          # Pro has its own @main. Boot and InMemorySwingStore live in this
          # file too and are re-provided in SourcesPro until P4 moves them
          # into Sources/ proper.
          - "SwingLabApp.swift"
      - path: SourcesPro
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swinglab.SwingLabPro
        PRODUCT_NAME: SwingLabPro
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        # Same argument as SwingLab: the detector walks two million pixels a
        # frame, and -Onone turns seconds of analysis into minutes.
        SWIFT_OPTIMIZATION_LEVEL: "-O"
    info:
      path: SwingLabPro-Info.plist
      properties:
        CFBundleDisplayName: SwingLab Pro
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Pro DOES network — but peer-to-peer and local-only, phone to phone
        # over MultipeerConnectivity with the OS's own session encryption and
        # nothing on top, which is exempt. There are still no internet
        # requests at all; nothing leaves the phones on the tripods.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: ""
        NSCameraUsageDescription: >-
          SwingLab Pro films your swings at 240fps to measure launch angle,
          exit velocity and 3D swing motion. Video never leaves your devices.
        NSMicrophoneUsageDescription: >-
          SwingLab Pro listens for the crack of bat on ball so it can capture
          the swing without you touching the phone — and so linked phones can
          agree on exactly when contact happened.
        NSPhotoLibraryAddUsageDescription: >-
          Save a swing clip to your photo library to share it.
        NSPhotoLibraryUsageDescription: >-
          Read a clip you already filmed so SwingLab Pro can measure it.
          Reading the library directly is the only way to get the ORIGINAL
          slow-motion recording — every other route hands over a 30fps render
          of it, and a 240fps clip measured as 30fps is wrong by a factor of
          eight.
        # Linked capture pairs two phones directly, no internet involved.
        NSLocalNetworkUsageDescription: >-
          SwingLab Pro links two iPhones over your local network so both film
          the same swing in sync. Video and measurements never leave your
          devices.
        NSBonjourServices:
          - _swinglab-pro._tcp
          - _swinglab-pro._udp
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIRequiredDeviceCapabilities:
          - arm64

  SwingLabProTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TestsPro
        excludes:
          - "Fixtures/**"
      - path: TestsPro/Fixtures
        buildPhase: resources
    dependencies:
      - target: SwingLabPro
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swinglab.SwingLabProTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  SwingLab:
    build:
      targets:
        SwingLab: all
        SwingLabTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - SwingLabTests
    profile:
      config: Release
    archive:
      config: Release

  SwingLabPro:
    build:
      targets:
        SwingLabPro: all
        SwingLabProTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - SwingLabProTests
    profile:
      config: Release
    archive:
      config: Release
